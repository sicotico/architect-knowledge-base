docs_dir: docs
site_dir: site
site_name: Piconocimiento - Notas Técnicas
site_description: Colección de artículos técnicos extraídos de conversaciones sobre Azure, IA, programación y más.
theme:
  name: material
  palette:
    primary: blue
    accent: "#0078d4"
    scheme: default
  font:
    text: "Segoe UI"
    code: Consolas
  logo: assets/logo.png
  favicon: assets/favicon.ico
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - toc.integrate
    - header.autohide
  custom_dir: docs/overrides
markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - tables
  - pymdownx.highlight:
      use_pygments: true
      pygments_style: github
  - pymdownx.extra

extra_css:
  - css/azure-learn.css

